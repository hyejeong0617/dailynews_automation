name: Requested market news summaries

on:
  push:
    branches: [main]
    paths:
      - 'data/requests/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-news-summary
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Summarize requested local transcripts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python generate_requested_news.py
      - name: Publish summaries to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _posts data/archive.csv data/summary_*.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish requested market news summaries"
            git push
          fi
